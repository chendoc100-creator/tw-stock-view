<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d1f23; --mute:#6b7280; --line:#e5e7eb; --up:#d0021b; --down:#1a7f37; --warn:#b8860b; --acc:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; }
  header { background:#111827; color:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .sub { color:#cbd5e1; font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .b-up { background:#fde2e4; color:var(--up); } .b-down { background:#dcfce7; color:var(--down); } .b-warn { background:#fef3c7; color:#92400e; } .b-mute { background:#e5e7eb; color:#374151; }
  nav { display:flex; gap:4px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); padding:0 8px; position:sticky; top:0; z-index:5; }
  nav button { border:0; background:none; padding:10px 12px; font-size:14px; color:var(--mute); border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer; }
  nav button.on { color:var(--ink); border-bottom-color:var(--acc); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:12px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .card h2 { font-size:15px; margin:0 0 8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .seg button { border:1px solid var(--line); background:#fff; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  .seg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tbl { width:100%; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { text-align:left; color:var(--mute); font-weight:500; border-bottom:1px solid var(--line); padding:6px 8px; white-space:nowrap; }
  td { padding:6px 8px; border-bottom:1px solid #f1f2f4; white-space:nowrap; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); } .mute { color:var(--mute); } .warn { color:#b45309; } .b { font-weight:600; }
  .lock-dn { background:#dcfce7; } .lock-up { background:#fde2e4; }
  table.hold tr.h1 td { border-bottom:0; padding-bottom:2px; } table.hold tr.h2 td { padding-top:0; font-size:12px; white-space:normal; }
  table.hold td.nm { white-space:normal; } table.hold td.nm small { color:var(--mute); margin-left:4px; }
  .chart { width:100%; height:340px; } .chart.sm { height:260px; } .chart.tall { height:460px; }
  .note { color:var(--mute); font-size:12px; margin-top:6px; }
  .err { color:var(--up); font-size:13px; }
  input, select { font-size:14px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  button.act { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button.ghost { background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
  .grid4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
  .kv { margin:0; padding-left:16px; } .kv li { margin:2px 0; }
  .verdict { font-size:15px; font-weight:600; }
  .pill { display:inline-block; margin:2px 4px 2px 0; padding:2px 8px; border-radius:12px; font-size:12px; }
  .hide { display:none; }
  button.sell, button.buy { padding:1px 7px; font-size:12px; color:var(--down); border-color:#86efac; margin-right:2px; }
  button.buy { color:var(--up); border-color:#fca5a5; }
  details.note { margin-top:6px; } details.note summary { cursor:pointer; color:var(--acc); }
  @media (max-width:640px){ main{ padding:8px 10px 40px; } .chart{ height:280px; } .chart.tall{ height:360px; } td,th{ padding:5px 6px; } .hm{ display:none; } }
</style>
</head>
<body>
<header>
  <h1>台股看盤</h1>
  <span id="hdr" class="sub">載入中…</span><span id="sync" class="sub" style="color:#fbbf24"></span>
  <span style="flex:1"></span>
  <button class="ghost" style="color:#fff;background:none;border-color:#475569" onclick="refreshAll()">重新整理</button>
</header>
<nav id="tabs"></nav>
<main>
  <section id="t-大盤">
    <div class="card"><h2>大盤狀態</h2><div id="trend"><span class="mute">載入中…</span></div></div>
    <div class="card"><h2>國際股市 <span id="mk-time" class="sub mute" style="font-weight:400;font-size:12px"></span></h2><div class="tbl" id="mk"></div></div>
    <div class="card"><h2>大盤風險指數 <span class="mute" style="font-weight:400;font-size:12px">0 最危險、100 最安全｜溫度計，不是賣出訊號</span></h2>
      <div id="risk"><span class="mute">載入中…</span></div><div class="note" id="risknow"></div><div id="rchart" class="chart sm"></div><div class="note" id="rnote2"></div></div>
    <div class="card"><h2>K 線 <span class="seg" id="kseg"></span><span class="seg" id="pseg"></span></h2><div id="kchart" class="chart tall"></div><div class="note" id="knote"></div></div>
    <div class="card"><h2>江玻圖（分時＋均價＋量）<span class="seg" id="iseg"></span></h2><div id="ichart" class="chart"></div><div class="note" id="inote"></div></div>
  </section>
  <section id="t-名單" class="hide"><div class="card"><h2>模型名單 <span id="lst-status" class="badge b-mute"></span></h2><div class="tbl" id="lst"></div>
    <div class="note">月營收創高突破＋主流股突破，最多 10 檔。隔天開盤買、訊號 5 個交易日內有效；賣：賺 20% 先賣一半，其餘收盤連 3 天在 60 日線下全賣。</div></div></section>
  <section id="t-排名" class="hide"><div class="card"><h2>排名 <select id="rsel" onchange="drawRank()"></select></h2><div class="tbl" id="rank"></div><div class="note" id="rnote"></div></div></section>
  <section id="t-警示" class="hide"><div id="alerts"></div></section>
  <section id="t-健診" class="hide">
    <div class="card"><div class="row"><input id="hid" list="hlist" placeholder="代號或名稱，例如 2330" style="width:200px">
      <datalist id="hlist"></datalist><button class="act" onclick="health()">健診</button><span class="note" id="hnote"></span></div></div>
    <div id="hout"></div>
  </section>
  <section id="t-ETF" class="hide"><div class="card"><h2>ETF 即時淨值與溢價 <input id="efilter" placeholder="篩選代號／名稱" oninput="drawETF()" style="width:160px"></h2>
    <div class="tbl" id="etf"></div><div class="note">預估淨值與溢價是投信每 15 秒左右估的（證交所轉發）；溢價＝市價高於淨值，買貴了。</div></div></section>
  <section id="t-持股" class="hide"><div class="card"><h2>損益（兩個帳號）</h2><div id="pnl"><span class="mute">載入中…</span></div></div><div class="card"><h2>持股 <span id="holdbtns"></span>
    <span class="note" id="holdnote"></span></h2><div id="buynew" class="hide"></div><div class="tbl" id="hold"></div>
    <div class="note">下面那行＝昨晚的判斷（綠賣、橘警戒、紅續抱）。現價綠底＝跌停、紅底＝漲停。</div></div></section>
</main>
<script>
var KEY = '';   // 看網頁的鑰匙（doGet 塞進來的）；每支 api* 都要帶
var API = "https://script.google.com/macros/s/AKfycbzel6anm0vMKWlxMsVjlEX4b-sLvj98cOJ9cLMmI19OCofZOEOJXx0TV53uQtVEMvs/exec";             // GitHub Pages 那份會換成 Apps Script 的 /exec 網址（webapp_gs.render_pages）；空白＝在 Apps Script 裡跑
// GitHub Pages 那份沒有 doGet 塞鑰匙：第一次用 …/#k=鑰匙 開，存在這台瀏覽器（localStorage），網址列的鑰匙隨即拿掉
if (KEY.indexOf('<' + '?') === 0 || !KEY) {
  var mk = (location.hash || '').match(/k=([A-Za-z0-9_-]+)/);
  try { if (mk) { localStorage.setItem('tw_key', mk[1]); } KEY = mk ? mk[1] : (localStorage.getItem('tw_key') || ''); } catch (e) { KEY = mk ? mk[1] : ''; }
  if (mk) { history.replaceState(null, '', location.pathname + location.search); }
}
var TABS = ['大盤', '名單', '排名', '警示', '健診', 'ETF', '持股'];
var D = null, ETF = null, kSym = '^TWII', iKind = 'TSE', charts = {};
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function num(v) { var x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? null : x; }
function fmt(v, d) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d}); }
function sgn(v, d) { return v === null || v === undefined || isNaN(v) ? '—' : (v > 0 ? '+' : '') + fmt(v, d); }
function cls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : ''; }
var WRITE = {apiSaveHoldings: 1, apiSell: 1, apiBuy: 1};
// 2026-11-25 量過：每問一次 Google 本身就要 1.4～1.9 秒（伺服器自己只花 0.1～1.6 秒）→ 讀的先拿這台瀏覽器上次存的立刻畫，背景再問新的。
// ok(v, meta)：meta.cached＝這是上次的（meta.at＝上次幾點拿到的）；新的回來跟上次一模一樣就不再呼叫 ok（不重畫、不閃）。
var CACHE = {apiData: 1, apiMarket: 1, apiDaily: 1, apiIntraday: 1, apiHoldings: 1, apiETF: 1};
var PENDING = 0;
function syncBadge(d) {
  PENDING = Math.max(0, PENDING + d);
  var el = $('sync'); if (el) { el.textContent = PENDING ? '⟳ 更新中' : ''; }
}
function cget(k) { try { var c = localStorage.getItem(k); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
function cput(k, s) {
  try { localStorage.setItem(k, s); } catch (e) {                 // 滿了：清掉舊的快取再試一次
    try { Object.keys(localStorage).forEach(function (x) { if (x.indexOf('c:') === 0) { localStorage.removeItem(x); } }); localStorage.setItem(k, s); } catch (e2) {}
  }
}
function run(fn, args, ok, fail) {
  var t0 = Date.now(), lab = '[api] ' + fn + (args && args.length ? '(' + String(args).slice(0, 20) + ')' : '');
  var ck = CACHE[fn] ? 'c:' + fn + ':' + JSON.stringify(args || []) : null, old = ck ? cget(ck) : null, oldS = old ? JSON.stringify(old.v) : null;
  if (old) { try { ok(old.v, {cached: true, at: old.t}); } catch (e) { console.log(e); } }
  if (ck) { syncBadge(1); }
  var done = function () { if (ck) { syncBadge(-1); } };
  var bad = function (m) { done(); console.log(lab, 'FAIL', Date.now() - t0, 'ms');
    if (old) { $('sync').textContent = '⚠ 有一項更新失敗，顯示的是上次的'; return; }
    (fail || function (x) { alert(x); })(m); };
  var good = function (v) {
    done(); console.log(lab, Date.now() - t0, 'ms');
    var s = ck ? JSON.stringify(v) : null;
    if (ck) { cput(ck, JSON.stringify({t: Date.now(), v: v})); }
    if (old && s === oldS) { return; }
    ok(v, {cached: false});
  };
  if (!API) {                                      // 在 Apps Script 裡：google.script.run
    var r = google.script.run.withSuccessHandler(good).withFailureHandler(function (e) { bad(String(e && e.message || e)); });
    r[fn].apply(r, [KEY].concat(args || []));
    return;
  }
  // GitHub Pages：fetch 問 /exec（credentials 不帶 → Google 不會轉成 /u/4/）。寫入用 POST＋text/plain（不觸發 CORS 預檢）
  var req = WRITE[fn] ? fetch(API, {method: 'POST', credentials: 'omit', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({api: fn, k: KEY, a: args || []})})
                      : fetch(API + '?api=' + fn + '&k=' + encodeURIComponent(KEY) + '&a=' + encodeURIComponent(JSON.stringify(args || [])), {credentials: 'omit'});
  req.then(function (res) { return res.json(); })
     .then(function (j) { if (j.ok) { good(j.v); } else { bad(j.err || '伺服器回錯誤'); } })
     .catch(function (e) { bad('連不上資料（' + String(e && e.message || e) + '）'); });
}

// ---------- 分頁
function initTabs() {
  $('tabs').innerHTML = TABS.map(function (t) { return '<button data-t="' + t + '">' + t + '</button>'; }).join('');
  [].forEach.call($('tabs').children, function (b) { b.onclick = function () { show(b.dataset.t); }; });
  var h = decodeURIComponent((location.hash || '').slice(1));
  show(TABS.indexOf(h) >= 0 ? h : '大盤');
}
function show(t) {
  TABS.forEach(function (x) { $('t-' + x).classList.toggle('hide', x !== t); });
  [].forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.t === t); });
  if (t === 'ETF' && !ETF) { loadETF(); }
  if (t === '持股') { loadHold(); }
  Object.keys(charts).forEach(function (k) { var c = charts[k]; if (c && c.el.offsetWidth) { c.chart.applyOptions({width: c.el.clientWidth}); if (c.redraw) { setTimeout(c.redraw, 50); } } });
}

// ---------- 表格
function table(rows, opt) {
  opt = opt || {};
  if (!rows || !rows.length || (rows.length === 1 && rows[0].length <= 1)) { return '<div class="mute">（沒有）</div>'; }
  var h = rows[0], numCol = h.map(function (c, j) { return rows.slice(1).every(function (r) { return r[j] === '' || num(r[j]) !== null; }) && !/代號|^.?日$|分點$|名稱|標的|領導/.test(c); });
  var signCol = h.map(function (c) { return /漲跌|漲幅|後%|變化/.test(c); });
  var s = '<table><tr>' + h.map(function (c, j) { return '<th class="' + (numCol[j] ? 'n' : '') + '">' + esc(c) + '</th>'; }).join('') + '</tr>';
  rows.slice(1).forEach(function (r) {
    s += '<tr>' + r.map(function (v, j) {
      var x = num(v), c = numCol[j] ? 'n' : '';
      if (signCol[j] && x !== null) { c += ' ' + cls(x); v = sgn(x, 2); }
      if (j === 0 && opt.link && /^[0-9A-Z]{4,6}$/.test(v)) { return '<td><a href="#" onclick="goHealth(\'' + esc(v) + '\');return false">' + esc(v) + '</a></td>'; }
      return '<td class="' + c + '">' + esc(v) + '</td>';
    }).join('') + '</tr>';
  });
  return s + '</table>';
}
function goHealth(id) { show('健診'); $('hid').value = id; health(); }

// ---------- 大盤
function loadMarket() {
  $('mk').innerHTML = '<span class="mute">抓即時報價…</span>';
  run('apiMarket', [], function (rows, mt) {
    var s = '<table><tr><th>項目</th><th class="n">價格</th><th class="n">漲跌</th><th class="n">幅度</th><th class="n">時間</th></tr>';
    rows.forEach(function (r) {
      var d = /台幣|美債/.test(r.name) ? 3 : 2;
      if (r.err) { s += '<tr><td>' + esc(r.name) + '</td><td colspan="4" class="mute">' + esc(r.err) + '</td></tr>'; return; }
      s += '<tr><td>' + esc(r.name) + '</td><td class="n">' + fmt(r.price, d) + '</td><td class="n ' + cls(r.pct) + '">' + sgn(r.chg, d)
        + '</td><td class="n ' + cls(r.pct) + '"><b>' + sgn(r.pct, 2) + '%</b></td><td class="n mute">' + esc(r.time || '') + '</td></tr>';
    });
    $('mk').innerHTML = s + '</table>';
    var at = new Date(mt && mt.cached ? mt.at : Date.now()).toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'});
    $('mk-time').textContent = mt && mt.cached ? '（' + at + ' 的，更新中…）' : '更新 ' + at;
    // 盤前／盤中估計：Code.gs 的 _preRisk 用台指期漲跌套昨晚的對照表（05:00～13:50 才有；收盤後等今晚重算）
    var pr = rows.filter(function (r) { return r.risk; })[0];
    if (pr) {
      var p = pr.risk, m = (D && D.meta) || {}, lo = num(m.risk_lo) || 28, hi = num(m.risk_hi) || 71;
      var c = p.est <= lo ? '#c2410c' : p.est >= hi ? '#1d4ed8' : '#374151';
      $('risknow').innerHTML = '<b>' + (p.session === '日盤' ? '盤中' : '盤前') + '估計</b>：照現在台指期 ' + sgn(p.pct, 2) + '%（' + esc(p.time) + '）'
        + (p.implied ? '、換算加權約 ' + fmt(p.implied, 0) : '') + '，今天收盤的風險指數約 <b style="color:' + c + '">' + fmt(p.est, 0) + '</b>'
        + (p.night && p.session === '日盤' ? '　夜盤收盤 ' + sgn(p.night.pct, 2) + '%' : '')
        + more(esc(m.risk_pre_note || ''));
    } else { $('risknow').innerHTML = ''; }
  }, function (m) { $('mk').innerHTML = '<span class="err">' + esc(m) + '</span>'; });
}
function seg(id, items, cur, fn) {
  $(id).innerHTML = items.map(function (x) { return '<button data-v="' + x[1] + '" class="' + (x[1] === cur ? 'on' : '') + '">' + x[0] + '</button>'; }).join(' ');
  [].forEach.call($(id).children, function (b) { b.onclick = function () { [].forEach.call($(id).children, function (x) { x.classList.toggle('on', x === b); }); fn(b.dataset.v); }; });
}
function mkChart(key, el, nShow) {
  if (charts[key]) { charts[key].chart.remove(); }
  el.innerHTML = '';
  el.style.position = 'relative';
  var ch = LightweightCharts.createChart(el, {width: el.clientWidth, height: el.clientHeight, layout: {background: {color: 'transparent'}, textColor: '#374151', fontSize: 11},
    grid: {vertLines: {color: '#f3f4f6'}, horzLines: {color: '#f3f4f6'}}, rightPriceScale: {borderColor: '#e5e7eb'},
    // ⚠ 間距在建圖當下用容器寬度算好：建完再 setVisibleLogicalRange 的話，圖還沒排版、寬度是 0，算出來的間距被夾到最小，
    //   兩年的 K 棒會擠在右邊四分之一（預覽窗格隱藏時一定發生，手機上看時間差）。nShow＝一開始要看到幾根。
    //   真正的原因：maxBarSpacing 沒給時上限＝圖寬的一半，建圖當下寬度還是 0 → 間距被夾到 minBarSpacing。給固定上限就好。
    // 看盤軟體的時間軸：右邊釘在最新一根（放大、拖曳都不會拉出一片空白）、左邊釘在最舊一根、縮放以右邊為錨。
    timeScale: {borderColor: '#e5e7eb', rightOffset: 3, minBarSpacing: 0.5, maxBarSpacing: 60, barSpacing: nShow ? Math.max(0.5, (el.clientWidth - 70) / (nShow + 3)) : 6,
                fixLeftEdge: true, fixRightEdge: true, rightBarStaysOnScroll: true, lockVisibleTimeRangeOnResize: true},
    crosshair: {mode: 0}, localization: {locale: 'zh-TW'}});
  var lg = document.createElement('div');                      // 看盤軟體那種左上角資訊列，十字線移到哪就顯示哪一根
  lg.style.cssText = 'position:absolute;left:6px;top:4px;z-index:3;font-size:12px;line-height:1.5;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px;pointer-events:none;max-width:92%';
  el.appendChild(lg);
  charts[key] = {chart: ch, el: el, legend: lg};
  return ch;
}
/** 等圖真的有寬度再設間距、捲到最新一根。建圖當下時間軸寬度是 0，那時設的間距會被夾到最小（預覽窗格隱藏時一定、手機上看時間差）。 */
function zoomWhenReady(ch, nShow) {
  var tries = 0;
  (function go() {
    var w = ch.timeScale().width();
    if (w > 0) { ch.timeScale().applyOptions({barSpacing: Math.max(0.5, Math.min(60, w / (nShow + 3)))}); ch.timeScale().scrollToPosition(3, false); return; }   // 不要用 scrollToRealTime：它是動畫，畫面沒在重畫時會停在半路、最後幾根被切掉
    if (++tries < 100) { setTimeout(go, 100); }
  })();
}
function vfmt(v) { return v === null || v === undefined ? '—' : v >= 1e8 ? fmt(v / 1e8, 2) + '億' : v >= 1e4 ? fmt(v / 1e4, 1) + '萬' : fmt(v, 0); }
function tkey(t) { if (typeof t === 'string' || typeof t === 'number') { return t; } var p = function (x) { return ('0' + x).slice(-2); }; return t.year + '-' + p(t.month) + '-' + p(t.day); }
function aggregate(bars, per) {

    + '<div id="pchart" class="chart" style="margin-top:8px"></div><div id="dchart" class="chart sm"></div>'
    + '<div class="note">黑＝總損益、藍＝已實現、橘＝未實現、灰＝加權（左軸）；下面是當日損益。</div>'
    + more('從 ' + esc(m.pnl_start || '') + ' 第一筆交易起，用' + (m.pnl_esun_in_chart ? '國泰＋e起發兩個帳號' : '國泰') + '的對帳單重建、每晚用收盤重算；現金股利是推算的。'
      + (m.pnl_esun_in_chart ? '' : 'e起發 沒有交易歷史，只算進上面的合計。') + '報酬＝總損益 ÷ 100 萬（沒投進去的現金也算），跟「100 萬全買大盤」比才公平。'
      + [].concat(m.pnl_check || []).map(function (x) { return '<br>對帳：' + esc(x); }).join(''));
  var el = $('pchart'), ch = mkChart('p', el, rows.length), lg = charts.p.legend;
  ch.applyOptions({leftPriceScale: {visible: true, borderColor: '#e5e7eb'}});
  var tw = ch.addLineSeries({color: '#9ca3af', lineWidth: 1, priceScaleId: 'left', priceFormat: {type: 'price', precision: 0, minMove: 1}, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false});
  tw.setData(rows.map(function (r) { return {time: r[0], value: num(r[5])}; }));
  var line = function (k, color, w) { var s = ch.addLineSeries({color: color, lineWidth: w, priceFormat: {type: 'price', precision: 0, minMove: 1}, priceLineVisible: false}); s.setData(rows.map(function (r) { return {time: r[0], value: num(r[k])}; })); return s; };
  var t = line(3, '#111827', 2); line(1, '#2563eb', 1); line(2, '#f59e0b', 1);   // 不用紅綠：台股紅綠是漲跌
  t.createPriceLine({price: 0, color: '#9ca3af', lineWidth: 1, lineStyle: 2, axisLabelVisible: false});
  var idx = {}; rows.forEach(function (r, i) { idx[r[0]] = i; });
  var show = function (i) { var r = rows[i]; lg.innerHTML = '<b>' + esc(r[0]) + '</b>　總 <b class="' + cls(num(r[3])) + '">' + sgn(num(r[3]), 0) + '</b>　<span style="color:#2563eb">已實現 ' + sgn(num(r[1]), 0)
    + '</span>　<span style="color:#d97706">未實現 ' + sgn(num(r[2]), 0) + '</span>　當日 <span class="' + cls(num(r[4])) + '">' + sgn(num(r[4]), 0) + '</span>　加權 ' + fmt(num(r[5]), 0)
    + '<br>帳戶 ' + sgn(num(r[6]), 2) + '%（÷100 萬）　大盤 ' + sgn(num(r[7]), 2) + '%'; };
  show(rows.length - 1);
  ch.subscribeCrosshairMove(function (p) { show(p && p.time !== undefined && idx[tkey(p.time)] !== undefined ? idx[tkey(p.time)] : rows.length - 1); });
  zoomWhenReady(ch, rows.length);
  var dc = mkChart('d', $('dchart'), rows.length);
  var h = dc.addHistogramSeries({priceFormat: {type: 'price', precision: 0, minMove: 1}, priceLineVisible: false});
  h.setData(rows.map(function (r) { var v = num(r[4]); return {time: r[0], value: v, color: v >= 0 ? 'rgba(208,2,27,.7)' : 'rgba(26,127,55,.7)'}; }));
  charts.d.legend.innerHTML = '當日損益（元）';
  zoomWhenReady(dc, rows.length);
  // 上下兩張圖一起捲動、縮放
  var sync = function (a, b) { a.timeScale().subscribeVisibleLogicalRangeChange(function (r) { if (r) { b.timeScale().setVisibleLogicalRange(r); } }); };
  sync(ch, dc); sync(dc, ch);
}
/** 「賣」：第 i 列（H.rows 的索引）下面展開一列，填股數（預設全部）、成交價（預設現價），按確定才送。 */
function sellForm(i) {
  var r = H.rows[i], el = $('sell' + i); if (!r || !el) { return; }
  if (!el.classList.contains('hide') && el.dataset.mode === 'sell') { el.classList.add('hide'); return; }
  var p = (H.quotes || {})[r[0]] || {}, n = num(r[3]);
  el.dataset.mode = 'sell';
  el.firstChild.innerHTML = '<div class="row" style="padding:6px 0"><b>賣出 ' + esc(r[0]) + ' ' + esc(r[1] || '') + '</b>'
    + '<label>股數 <input id="sq' + i + '" type="number" inputmode="numeric" min="1" value="' + (n || '') + '" style="width:100px;text-align:right"></label>'
    + '<label>成交價 <input id="sp' + i + '" type="number" inputmode="decimal" step="0.01" value="' + (p.price ? Number(p.price).toFixed(2) : '') + '" style="width:100px;text-align:right"></label>'
    + '<button class="act" onclick="doSell(' + i + ')">確定賣出</button> <button class="ghost" onclick="sellForm(' + i + ')">取消</button>'
    + '<span class="note" id="sn' + i + '">持有 ' + fmt(n, 0) + ' 股；賣光這一列會刪掉，另外記進試算表的「買賣紀錄」</span></div>';
  el.classList.remove('hide');
}
/** 「買」：第 i 列下面展開；股數＋成交價，送出後跟這一列合併（股數相加、成本加權平均）。 */
function buyForm(i) {
  var r = H.rows[i], el = $('sell' + i); if (!r || !el) { return; }
  if (!el.classList.contains('hide') && el.dataset.mode === 'buy') { el.classList.add('hide'); return; }
  var p = (H.quotes || {})[r[0]] || {}, n = num(r[3]), c = num(r[4]);
  el.dataset.mode = 'buy';
  el.firstChild.innerHTML = '<div class="row" style="padding:6px 0"><b class="up">買進 ' + esc(r[0]) + ' ' + esc(r[1] || '') + '</b>'
    + '<label>股數 <input id="bq' + i + '" type="number" inputmode="numeric" min="1" value="1000" style="width:100px;text-align:right"></label>'
    + '<label>成交價 <input id="bp' + i + '" type="number" inputmode="decimal" step="0.01" value="' + (p.price ? Number(p.price).toFixed(2) : '') + '" style="width:100px;text-align:right"></label>'
    + '<button class="act" onclick="doBuy(' + i + ')">確定買進</button> <button class="ghost" onclick="buyForm(' + i + ')">取消</button>'
    + '<span class="note" id="bn' + i + '">原本 ' + fmt(n, 0) + ' 股、成本 ' + fmt(c, 2) + '；會合併成一列（成本變加權平均）</span></div>';
  el.classList.remove('hide');
}
function doBuy(i) {
  var r = H.rows[i], q = num($('bq' + i).value), p = num($('bp' + i).value);
  if (!(q > 0) || !(p > 0)) { $('bn' + i).textContent = '股數和成交價都要填'; return; }
  if (!confirm('買進 ' + r[0] + ' ' + fmt(q, 0) + ' 股，成交價 ' + fmt(p, 2) + '？（合併到原本那一列）')) { return; }
  $('bn' + i).textContent = '儲存中…';
  run('apiBuy', [i, r[0], r[2] || '', q, p], buyDone, function (m) { $('bn' + i).textContent = m; });
}
function buyDone(x) {
  $('holdnote').textContent = '已記：買 ' + x.id + (x.merged ? '，合併後 ' + fmt(x.shares, 0) + ' 股、成本 ' + fmt(x.cost, 2) : '，新增一列 ' + fmt(x.shares, 0) + ' 股');
  $('buynew').classList.add('hide'); loadHold();
}
/** 「＋ 買進」：代號、帳戶、股數、成交價；手上已經有同代號（同帳戶）的會合併，沒有才新增一列。 */
function buyNew() {
  var el = $('buynew');
  if (!el.classList.contains('hide')) { el.classList.add('hide'); return; }
  var accts = []; (H.rows || []).slice(1).forEach(function (r) { if (r[2] && accts.indexOf(r[2]) < 0) { accts.push(r[2]); } });
  el.innerHTML = '<div class="row" style="padding:6px 0 10px"><b class="up">買進</b>'
    + '<label>代號 <input id="nbid" list="hlist" placeholder="2330" style="width:90px"></label>'
    + (accts.length ? '<label>帳戶 <select id="nba">' + accts.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join('') + '</select></label>' : '<input id="nba" type="hidden" value="">')
    + '<label>股數 <input id="nbq" type="number" inputmode="numeric" min="1" value="1000" style="width:90px;text-align:right"></label>'
    + '<label>成交價 <input id="nbp" type="number" inputmode="decimal" step="0.01" style="width:90px;text-align:right"></label>'
    + '<button class="act" onclick="doBuyNew()">確定買進</button> <button class="ghost" onclick="buyNew()">取消</button>'
    + '<span class="note" id="nbn">手上已經有同一檔（同帳戶）會合併成一列</span></div>';
  el.classList.remove('hide');
}
function doBuyNew() {
  var id = String($('nbid').value || '').trim().toUpperCase().split(/\s/)[0], a = $('nba').value, q = num($('nbq').value), p = num($('nbp').value);
  if (!/^[0-9A-Z]{4,6}$/.test(id)) { $('nbn').textContent = '代號要 4～6 碼'; return; }
  if (!(q > 0) || !(p > 0)) { $('nbn').textContent = '股數和成交價都要填'; return; }
  if (!confirm('買進 ' + id + ' ' + fmt(q, 0) + ' 股，成交價 ' + fmt(p, 2) + (a ? '（' + a + '）' : '') + '？')) { return; }
  $('nbn').textContent = '儲存中…';
  run('apiBuy', [0, id, a, q, p], buyDone, function (m) { $('nbn').textContent = m; });
}
function doSell(i) {
  var r = H.rows[i], q = num($('sq' + i).value), p = num($('sp' + i).value), n = num(r[3]);
  if (!(q > 0) || !(p > 0)) { $('sn' + i).textContent = '股數和成交價都要填'; return; }
  if (n && q > n) { $('sn' + i).textContent = '只有 ' + fmt(n, 0) + ' 股'; return; }
  if (!confirm('賣出 ' + r[0] + ' ' + fmt(q, 0) + ' 股，成交價 ' + fmt(p, 2) + '？')) { return; }
  $('sn' + i).textContent = '儲存中…';
  run('apiSell', [i, r[0], q, p], function (x) {
    $('holdnote').textContent = '已記：賣 ' + x.id + ' ' + fmt(x.shares, 0) + ' 股 @ ' + fmt(x.price, 2) + (x.pnl !== null ? '，損益 ' + sgn(x.pnl, 0) + '（未扣費稅）' : '') + (x.left > 0 ? '，剩 ' + fmt(x.left, 0) + ' 股' : '，已賣光');
    loadHold();
  }, function (m) { $('sn' + i).textContent = m; });
}
function addRow() { if (!H) { return; } HEDIT = true; H.rows.push(['', '', '', '', '', '']); drawHold(); }
function delRow(i) { H.rows.splice(i + 1, 1); drawHold(); }
function saveHold() {
  $('holdnote').textContent = '儲存中…';
  run('apiSaveHoldings', [H.rows.slice(1)], function (r) { $('holdnote').textContent = '已存 ' + r.n + ' 檔'; HEDIT = false; loadHold(); }, function (m) { $('holdnote').textContent = m; });
}

function refreshAll() { loadData(); loadMarket(); loadK(kSym); loadIntra(iKind); if (!$('t-ETF').classList.contains('hide')) { loadETF(); } if (!$('t-持股').classList.contains('hide')) { loadHold(); } }
function trading() { var d = new Date(), w = d.getDay(), m = d.getHours() * 60 + d.getMinutes(); return w > 0 && w < 6 && m >= 525 && m <= 830; }
window.onload = function () {
  if (!KEY) { document.querySelector('main').innerHTML = '<div class="card">這台瀏覽器還沒有鑰匙：請用信裡最下面的連結（或電腦 data/apps_script/網頁網址.txt 裡的網址）開一次，之後存書籤就好。</div>'; return; }
  if (!H) { H = {rows: [['代號', '股數', '成本', '備註']]}; }
  initTabs();
  seg('kseg', [['台股加權', '^TWII'], ['那斯達克', '^IXIC'], ['費半', '^SOX']], kSym, loadK);
  seg('pseg', [['日', 'D'], ['週', 'W'], ['月', 'M']], kPer, function (v) { kPer = v; drawK(); });
  seg('iseg', [['現貨', 'TSE'], ['期指日盤', 'TXF'], ['期指夜盤', 'TXN']], iKind, loadIntra);
  loadData(); loadMarket(); loadK(kSym); loadIntra(iKind);
  setInterval(function () { if (trading() && !document.hidden) { loadMarket(); loadIntra(iKind); } }, 120000);
  window.onresize = function () { Object.keys(charts).forEach(function (k) { var c = charts[k]; if (c.el.offsetWidth) { c.chart.applyOptions({width: c.el.clientWidth}); if (c.redraw) { setTimeout(c.redraw, 50); } } }); };
};
</script>
